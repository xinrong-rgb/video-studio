*{box-sizing:border-box}

button{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;font-size:16px;
  font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#e6446b,#7c5cff);}
#err{display:none;margin-top:12px;font-size:13px;color:#ff7d9c;}
#busy{display:none;margin-top:12px;font-size:13px;color:#9aa1b5;}

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const subtle=crypto.subtle,enc=new TextEncoder(),dec=new TextDecoder();
async function open(K){
  const kKey=await subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const pt=await subtle.decrypt({name:'AES-GCM',iv:d64(DATA.ivP)},kKey,d64(DATA.ct));
  const html=dec.decode(pt);
  // ★ 版面 bug 修復（2026-08-20）：解密是 async，若此時 HTML 解析器還在跑，
  //   document.open() 依規格是 no-op，登入頁的 body{display:flex} 不會被清掉，
  //   整份工具就被擠成 flex 橫列（卡片變窄、文字直排錯落）。
  //   所以：先等解析結束，再親手清掉登入頁的樣式與節點，最後才寫入工具。
  if(document.readyState==='loading')
    await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  document.querySelectorAll('style,link[rel=stylesheet]').forEach(n=>n.remove());
  document.body.removeAttribute('class');document.body.removeAttribute('style');
  while(document.body.firstChild)document.body.removeChild(document.body.firstChild);
  document.open();document.write(html);document.close();
}

})();

  const err=document.getElementById('err'),busy=document.getElementById('busy');
  err.style.display='none';busy.style.display='block';
  const acc=DATA.accounts.find(a=>a.u===u);
  try{
    if(!acc)throw 0;
    const base=await subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
    const kek=await subtle.deriveKey(
      {name:'PBKDF2',salt:d64(acc.s),iterations:DATA.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const K=new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:d64(acc.i)},kek,d64(acc.w)));
    if(document.getElementById('rm').checked)
      localStorage.setItem('kjv_k',[...K].map(b=>b.toString(16).padStart(2,'0')).join(''));
    await open(K);
  }catch(e){busy.style.display='none';err.style.display='block';}
};
</script>
