<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f5f6fa;color:#1e2231;color-scheme:light;
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;}
.box{width:min(92vw,380px);background:#fff;border:1px solid #dde1ec;border-radius:18px;
  box-shadow:0 2px 6px rgba(30,34,49,.06),0 12px 32px rgba(30,34,49,.07);
  padding:28px 24px;text-align:center;}
h1{font-size:20px;margin:0 0 4px;background:linear-gradient(90deg,#e6446b,#7c5cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:12px;color:#646b85;margin-bottom:20px;}
input{width:100%;padding:13px;margin-top:10px;border-radius:12px;border:1.5px solid #dde1ec;
  background:#eef0f5;color:#1e2231;font-size:16px;}
input:focus{outline:none;border-color:#7c5cff;}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:#646b85;margin-top:14px;}
label input{width:16px;height:16px;margin:0;accent-color:#e6446b;}
button{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;font-size:16px;
  font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#e6446b,#7c5cff);}
#err{display:none;margin-top:12px;font-size:13px;color:#c2274d;}
#busy{display:none;margin-top:12px;font-size:13px;color:#646b85;}
</style>
</head>

const subtle=crypto.subtle,enc=new TextEncoder(),dec=new TextDecoder();
const LS='kjv_kek';

// 由密碼導出 KEK（只跟密碼＋鹽有關，所以跨版本穩定）
async function deriveKek(pass,saltB64){
  const base=await subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await subtle.deriveBits(
    {name:'PBKDF2',salt:d64(saltB64),iterations:DATA.iter,hash:'SHA-256'},base,256));
}
// 用 KEK 解開包裹，拿到這一版的主金鑰 K
async function unwrap(acc,kekBytes){
  const kek=await subtle.importKey('raw',kekBytes,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:d64(acc.i)},kek,d64(acc.w)));
}

  // ★ 版面 bug 修復（2026-08-20）：解密是 async，若此時 HTML 解析器還在跑，
  //   document.open() 依規格是 no-op，登入頁的 body{display:flex} 不會被清掉，
  //   整份工具就被擠成 flex 橫列（卡片變窄、文字直排錯落）。
  //   所以：先等解析結束，再親手清掉登入頁的樣式與節點，最後才寫入工具。
  if(document.readyState==='loading')
    await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  document.querySelectorAll('style,link[rel=stylesheet]').forEach(n=>n.remove());
  document.body.removeAttribute('class');document.body.removeAttribute('style');
  while(document.body.firstChild)document.body.removeChild(document.body.firstChild);
  document.open();document.write(html);document.close();
}
(async()=>{ // 記住我：存的是 KEK，更版後照樣解得開（主金鑰換了也沒關係）
  try{
    localStorage.removeItem('kjv_k');   // 舊版存的是主金鑰，已不適用，順手清掉
    const saved=localStorage.getItem(LS);
    if(!saved)return;
    const i=saved.indexOf(':');
    const u=saved.slice(0,i), kekHex=saved.slice(i+1);
    const acc=DATA.accounts.find(x=>x.u===u);
    if(!acc)throw new Error('帳號已移除');
    await open(await unwrap(acc,unhex(kekHex)));
  }catch(e){localStorage.removeItem(LS);}
})();
document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const err=document.getElementById('err'),busy=document.getElementById('busy');
  err.style.display='none';busy.style.display='block';
  const acc=DATA.accounts.find(a=>a.u===u);
  try{
    if(!acc)throw 0;
    const kekBytes=await deriveKek(p,acc.s);
    const K=await unwrap(acc,kekBytes);
    if(document.getElementById('rm').checked)
      localStorage.setItem(LS,acc.u+':'+hex(kekBytes));
    await open(K);
  }catch(e){busy.style.display='none';err.style.display='block';}
};
